<!DOCTYPE html>
<html lang="en" data-framework="javascript-es6">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="A TodoMVC written with JavaScript es5 features." />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>TodoMVC: JavaScript Es6 Webpack</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" />
    </head>
    <body>
        <section class="todoapp">
            <header class="header">
                <p class="brand">QuestLog</p>
                <h1>todos</h1>
                <p class="tagline">Turn your tasks into adventures</p>
                <input class="new-todo" placeholder="What needs to be done?" aria-label="What needs to be done?" autofocus />
            </header>
            <main class="main">
                <div class="toggle-all-container">
                    <input class="toggle-all" type="checkbox" aria-label="Mark all as complete" />
                    <label class="toggle-all-label" for="toggle-all">Mark all as complete</label>
                </div>
                <ul class="todo-list"></ul>
            </main>
            <footer class="footer">
                <div class="footer-inner">
                    <span class="todo-count" aria-live="polite" aria-atomic="true"></span>
                    <ul class="filters">
                        <li>
                            <a href="#/" class="selected">All</a>
                        </li>
                        <li>
                            <a href="#/active">Active</a>
                        </li>
                        <li>
                            <a href="#/completed">Completed</a>
                        </li>
                    </ul>
                    <button class="clear-completed">Clear completed</button>
                </div>
            </footer>
        </section>
        <footer class="info">
            <p>Double-click to edit a todo</p>
			<p>Created by the TodoMVC Team</p>
			<p>Part of <a href="http://todomvc.com">TodoMVC</a></p>
        </footer>
        <div class="desk-scene" aria-hidden="true">
            <span class="prop prop-coin prop-coin-a"></span>
            <span class="prop prop-coin prop-coin-b"></span>
            <span class="prop prop-quill"></span>
            <span class="prop prop-crystals"></span>
            <span class="prop prop-compass"></span>
            <div class="desk-lamp">
                <span class="lamp-glow"></span>
                <span class="lamp-chimney"></span>
                <span class="lamp-flame"></span>
                <span class="lamp-body"></span>
            </div>
        </div>
		<script src="./base.js"></script>
    </body>
</html>
